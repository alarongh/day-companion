services:
  companion:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/bot.sqlite3
      TESSERACT_CMD: tesseract
    volumes:
      - companion-data:/app/data
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  companion-data:
